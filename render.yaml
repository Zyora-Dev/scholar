services:
  - type: web
    name: tribal-saksham-api
    runtime: node
    rootDir: server
    plan: free
    autoDeployTrigger: 'off'
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: AI_MODE
        value: demo

  - type: web
    name: tribal-saksham-web
    runtime: static
    rootDir: client
    autoDeployTrigger: 'off'
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: VITE_API_URL
        fromService:
          name: tribal-saksham-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html